<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インベーダーゲーム</title>
    <style>
        /* ページ全体の背景を黒にして、キャンバスを中央に置く */
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #444;
            display: block;
        }
        /* スマートフォン用：画面が小さいときにキャンバスを縮小する */
        @media (max-width: 660px) {
            canvas {
                width: 100vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="640" height="540"></canvas>

    <script>
        // キャンバスと描画用のコンテキストを取得する
        const canvas = document.getElementById('gameCanvas');
        const ctx    = canvas.getContext('2d');

        // ─── 定数の設定（画面サイズ・速さなど） ─────────────────────
        const 画面の幅      = 640;
        const 画面の高さ    = 540;
        const 自機の速さ    = 5;
        const 弾の速さ      = 8;
        const 敵弾の速さ    = 3;
        const 敵の横の速さ  = 1;
        const 敵の縦移動量  = 20;

        // ─── 色の設定 ─────────────────────────────────────────────
        const 色 = {
            黒:     '#000000',
            白:     '#ffffff',
            赤:     '#ff3232',
            緑:     '#32ff32',
            青:     '#6496ff',
            黄:     '#ffdc32',
            オレンジ: '#ff8c00',
            灰:     '#646464',
        };

        // ─── キーボードの押下状態を管理する ──────────────────────
        const キー = {};
        document.addEventListener('keydown', e => {
            キー[e.code] = true;
            // スペースキーでページがスクロールしないようにする
            if (e.code === 'Space') e.preventDefault();
        });
        document.addEventListener('keyup',   e => { キー[e.code] = false; });

        // ─── ゲームの状態をまとめて保持する変数 ─────────────────
        let ゲーム;

        // ─── ゲームをリセット（初期化）する関数 ─────────────────
        function ゲームを初期化する() {
            ゲーム = {
                自機: {
                    x: 画面の幅 / 2 - 20,  // 画面中央に配置
                    y: 画面の高さ - 40,
                    幅: 40,
                    高さ: 30,
                    弾クールダウン: 0,      // 連射を防ぐタイマー
                },
                自機弾リスト: [],           // 自機が撃った弾の一覧
                敵リスト:     [],           // 敵の一覧
                敵弾リスト:   [],           // 敵が撃った弾の一覧
                爆発リスト:   [],           // 爆発エフェクトの一覧
                スコア:         0,
                残機:           3,
                敵の移動方向:   1,          // 1:右向き、-1:左向き
                敵の弾タイマー: 0,          // 敵が弾を撃つタイミング用
                ゲームオーバー: false,
                クリア:         false,
            };

            // 4行 × 10列 の敵を並べて配置する
            for (let 行 = 0; 行 < 4; 行++) {
                for (let 列 = 0; 列 < 10; 列++) {
                    ゲーム.敵リスト.push({
                        x:    60 + 列 * 54,
                        y:    60 + 行 * 50,
                        幅:   36,
                        高さ: 28,
                        種類: 行,           // 行によって色・得点が変わる
                    });
                }
            }
        }

        // ─── 自機（宇宙船）を描く ─────────────────────────────────
        function 自機を描く(m) {
            const 中央x = m.x + m.幅 / 2;

            // 三角形の緑の宇宙船
            ctx.fillStyle = 色.緑;
            ctx.beginPath();
            ctx.moveTo(中央x,          m.y);           // 頂点（上）
            ctx.lineTo(m.x,            m.y + m.高さ);  // 左下
            ctx.lineTo(m.x + m.幅,     m.y + m.高さ);  // 右下
            ctx.closePath();
            ctx.fill();

            // エンジン部分（青い四角）
            ctx.fillStyle = 色.青;
            ctx.fillRect(中央x - 5, m.y + 20, 10, 10);
        }

        // ─── 敵（エイリアン）を描く ───────────────────────────────
        function 敵を描く(e) {
            // 行によって色を変える（赤→オレンジ→白→白）
            const 色一覧 = [色.赤, 色.オレンジ, 色.白, 色.白];
            const c      = 色一覧[e.種類];
            const 中央x  = e.x + e.幅 / 2;

            ctx.strokeStyle = c;
            ctx.lineWidth   = 2;

            // 胴体（四角）
            ctx.fillStyle = c;
            ctx.fillRect(e.x + 6, e.y + 8, 24, 14);

            // 頭（楕円）
            ctx.beginPath();
            ctx.ellipse(中央x, e.y + 7, 8, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // 目（黒い丸）
            ctx.fillStyle = 色.黒;
            ctx.beginPath();
            ctx.arc(中央x - 4, e.y + 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(中央x + 4, e.y + 6, 3, 0, Math.PI * 2);
            ctx.fill();

            // 触角（上に伸びる線）
            ctx.strokeStyle = c;
            ctx.beginPath();
            ctx.moveTo(中央x - 6, e.y + 2);
            ctx.lineTo(中央x - 10, e.y - 4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(中央x + 6, e.y + 2);
            ctx.lineTo(中央x + 10, e.y - 4);
            ctx.stroke();

            // 足（下に伸びる線）
            ctx.beginPath(); ctx.moveTo(中央x - 8, e.y + 22); ctx.lineTo(中央x - 12, e.y + 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(中央x,     e.y + 22); ctx.lineTo(中央x,       e.y + 28); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(中央x + 8, e.y + 22); ctx.lineTo(中央x + 12,  e.y + 28); ctx.stroke();
        }

        // ─── 爆発エフェクトを描く ─────────────────────────────────
        function 爆発を描く(exp) {
            const 大きさ一覧 = [10, 20, 28, 16];
            const 大きさ     = 大きさ一覧[exp.コマ];

            // 外側（オレンジの丸）
            ctx.fillStyle = 色.オレンジ;
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, 大きさ, 0, Math.PI * 2);
            ctx.fill();

            // 内側（黄色の丸）
            ctx.fillStyle = 色.黄;
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, Math.max(大きさ - 6, 2), 0, Math.PI * 2);
            ctx.fill();
        }

        // ─── テキストを画面に表示する ─────────────────────────────
        function テキスト表示(テキスト, x, y, color = 色.白, サイズ = 22) {
            ctx.fillStyle = color;
            ctx.font      = `bold ${サイズ}px monospace`;
            ctx.fillText(テキスト, x, y);
        }

        // ─── 2つの四角が重なっているか（当たり判定）を調べる ────
        function 当たっているか(a, b) {
            return a.x < b.x + b.幅  &&
                   a.x + a.幅  > b.x &&
                   a.y < b.y + b.高さ &&
                   a.y + a.高さ > b.y;
        }

        // ─── ゲームの状態を1フレーム分だけ更新する ─────────────
        function ゲームを更新する() {
            // ゲームオーバーまたはクリア中は更新しない
            if (ゲーム.ゲームオーバー || ゲーム.クリア) return;

            // ── 自機を左右に動かす ────────────────────────────────
            if (キー['ArrowLeft']  && ゲーム.自機.x > 0) {
                ゲーム.自機.x -= 自機の速さ;
            }
            if (キー['ArrowRight'] && ゲーム.自機.x + ゲーム.自機.幅 < 画面の幅) {
                ゲーム.自機.x += 自機の速さ;
            }

            // クールダウンを1ずつ減らす
            if (ゲーム.自機.弾クールダウン > 0) ゲーム.自機.弾クールダウン--;

            // ── スペースキーで弾を撃つ ────────────────────────────
            if (キー['Space'] && ゲーム.自機.弾クールダウン === 0) {
                ゲーム.自機弾リスト.push({
                    x:    ゲーム.自機.x + ゲーム.自機.幅 / 2 - 2,
                    y:    ゲーム.自機.y,
                    幅:   4,
                    高さ: 14,
                });
                ゲーム.自機.弾クールダウン = 20;  // 20フレーム待たないと次は撃てない
            }

            // ── 自機の弾を上に移動させ、画面外に出たら削除する ──
            ゲーム.自機弾リスト = ゲーム.自機弾リスト
                .map(b => ({ ...b, y: b.y - 弾の速さ }))
                .filter(b => b.y + b.高さ > 0);

            // ── 敵の弾を下に移動させ、画面外に出たら削除する ────
            ゲーム.敵弾リスト = ゲーム.敵弾リスト
                .map(b => ({ ...b, y: b.y + 敵弾の速さ }))
                .filter(b => b.y < 画面の高さ);

            // ── 爆発アニメーションを4フレームごとに次のコマへ進める ──
            ゲーム.爆発リスト = ゲーム.爆発リスト
                .map(exp => ({ ...exp, タイマー: exp.タイマー + 1 }))
                .map(exp => (exp.タイマー % 4 === 0) ? { ...exp, コマ: exp.コマ + 1 } : exp)
                .filter(exp => exp.コマ < 4);  // 4コマ終わったら削除

            // ── 敵を左右に動かす（端に来たら方向転換して下に下がる） ──
            if (ゲーム.敵リスト.length > 0) {
                const 一番右 = Math.max(...ゲーム.敵リスト.map(e => e.x + e.幅));
                const 一番左 = Math.min(...ゲーム.敵リスト.map(e => e.x));

                if (一番右 >= 画面の幅 - 5) {
                    ゲーム.敵の移動方向 = -1;  // 右端 → 左向きに変える
                    ゲーム.敵リスト.forEach(e => { e.y += 敵の縦移動量; });
                } else if (一番左 <= 5) {
                    ゲーム.敵の移動方向 = 1;   // 左端 → 右向きに変える
                    ゲーム.敵リスト.forEach(e => { e.y += 敵の縦移動量; });
                }
                ゲーム.敵リスト.forEach(e => { e.x += 敵の横の速さ * ゲーム.敵の移動方向; });

                // ── 敵がランダムなタイミングで弾を撃つ ──────────
                ゲーム.敵の弾タイマー++;
                // 約50〜90フレームに1回、ランダムな敵が弾を撃つ
                if (ゲーム.敵の弾タイマー >= (50 + Math.floor(Math.random() * 40))) {
                    ゲーム.敵の弾タイマー = 0;
                    const 射撃する敵 = ゲーム.敵リスト[Math.floor(Math.random() * ゲーム.敵リスト.length)];
                    ゲーム.敵弾リスト.push({
                        x:    射撃する敵.x + 射撃する敵.幅 / 2 - 2,
                        y:    射撃する敵.y + 射撃する敵.高さ,
                        幅:   4,
                        高さ: 12,
                    });
                }

                // ── 敵が自機の高さまで降りてきたらゲームオーバー ──
                if (Math.max(...ゲーム.敵リスト.map(e => e.y + e.高さ)) >= ゲーム.自機.y) {
                    ゲーム.ゲームオーバー = true;
                    return;
                }
            }

            // ── 自機の弾が敵に当たったか調べる ───────────────────
            const 残る自機弾 = [];
            for (const 弾 of ゲーム.自機弾リスト) {
                let 当たった = false;
                ゲーム.敵リスト = ゲーム.敵リスト.filter(敵 => {
                    if (!当たった && 当たっているか(弾, 敵)) {
                        // 爆発エフェクトを発生させる
                        ゲーム.爆発リスト.push({
                            x: 敵.x + 敵.幅 / 2,
                            y: 敵.y + 敵.高さ / 2,
                            コマ:   0,
                            タイマー: 0,
                        });
                        // 行によって得点が変わる（上の行ほど高得点）
                        ゲーム.スコア += (敵.種類 + 1) * 10;
                        当たった = true;
                        return false;  // この敵を削除する
                    }
                    return true;
                });
                if (!当たった) 残る自機弾.push(弾);  // 当たらなかった弾は残す
            }
            ゲーム.自機弾リスト = 残る自機弾;

            // ── 敵の弾が自機に当たったか調べる ───────────────────
            const 自機の当たり判定 = ゲーム.自機;
            let 被弾した = false;
            ゲーム.敵弾リスト = ゲーム.敵弾リスト.filter(b => {
                if (!被弾した && 当たっているか(b, 自機の当たり判定)) {
                    被弾した = true;
                    return false;  // 当たった弾を削除する
                }
                return true;
            });
            if (被弾した) {
                // 爆発エフェクトを発生させる
                ゲーム.爆発リスト.push({
                    x: ゲーム.自機.x + ゲーム.自機.幅 / 2,
                    y: ゲーム.自機.y + ゲーム.自機.高さ / 2,
                    コマ:   0,
                    タイマー: 0,
                });
                ゲーム.残機--;
                if (ゲーム.残機 <= 0) {
                    ゲーム.ゲームオーバー = true;
                } else {
                    // 残機があれば自機を中央に戻す
                    ゲーム.自機.x = 画面の幅 / 2 - 20;
                }
            }

            // ── 敵を全員倒したらステージクリア ───────────────────
            if (ゲーム.敵リスト.length === 0) {
                ゲーム.クリア = true;
            }
        }

        // ─── 画面に全てのものを描く ───────────────────────────────
        function 画面を描く() {
            // 背景を黒く塗りつぶす
            ctx.fillStyle = 色.黒;
            ctx.fillRect(0, 0, 画面の幅, 画面の高さ);

            // 敵を全部描く
            ゲーム.敵リスト.forEach(e => 敵を描く(e));

            // 自機を描く（ゲームオーバーでないときのみ）
            if (!ゲーム.ゲームオーバー) {
                自機を描く(ゲーム.自機);
            }

            // 自機の弾を黄色い四角で描く
            ctx.fillStyle = 色.黄;
            ゲーム.自機弾リスト.forEach(b => ctx.fillRect(b.x, b.y, b.幅, b.高さ));

            // 敵の弾を赤い四角で描く
            ctx.fillStyle = 色.赤;
            ゲーム.敵弾リスト.forEach(b => ctx.fillRect(b.x, b.y, b.幅, b.高さ));

            // 爆発エフェクトを描く
            ゲーム.爆発リスト.forEach(exp => 爆発を描く(exp));

            // スコアと残機を画面上部に表示する
            テキスト表示(`SCORE: ${ゲーム.スコア}`,    10,             35, 色.白,  28);
            テキスト表示('♥ '.repeat(ゲーム.残機), 画面の幅 - 130, 35, 色.赤,  28);

            // ゲームオーバー画面を表示する
            if (ゲーム.ゲームオーバー) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';  // 半透明の黒で暗くする
                ctx.fillRect(0, 0, 画面の幅, 画面の高さ);
                テキスト表示('GAME OVER',                    185, 240, 色.赤,  52);
                テキスト表示(`SCORE: ${ゲーム.スコア}`,        230, 305, 色.白,  32);
                テキスト表示('R キーで再スタート',              195, 365, 色.黄,  26);
            }

            // ステージクリア画面を表示する
            if (ゲーム.クリア) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';  // 半透明の黒で暗くする
                ctx.fillRect(0, 0, 画面の幅, 画面の高さ);
                テキスト表示('STAGE CLEAR!',                  160, 240, 色.緑,  52);
                テキスト表示(`SCORE: ${ゲーム.スコア}`,        230, 305, 色.白,  32);
                テキスト表示('R キーで再スタート',              195, 365, 色.黄,  26);
            }

            // 操作説明を画面の下に表示する
            テキスト表示('←→:移動  スペース:弾  R:リスタート', 140, 画面の高さ - 10, 色.灰, 20);
        }

        // ─── Rキーでゲームを再スタートする ───────────────────────
        document.addEventListener('keydown', e => {
            if (e.code === 'KeyR' && (ゲーム.ゲームオーバー || ゲーム.クリア)) {
                ゲームを初期化する();
            }
        });

        // ─── ゲームループ（毎フレーム自動的に呼ばれる） ──────────
        function ゲームループ() {
            ゲームを更新する();  // ゲームの状態を更新する
            画面を描く();        // 画面に描く
            requestAnimationFrame(ゲームループ);  // 次のフレームでまた自分を呼ぶ
        }

        // ─── ゲームをスタートする ─────────────────────────────────
        ゲームを初期化する();
        ゲームループ();
    </script>
</body>
</html>
